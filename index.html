<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智护金塘平台系统</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="banner">
    <div class="banner-row">
      <div class="avatar"></div>
      <div class="user-info">
        <div class="user-name" id="userNameEdit">
          <div class="user-name-display">
            用户名
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
              <path d="M3 13c2.5 3.5 6 5 9 5s6.5-1.5 9-5"/>
              <path d="M5 16l-1 2"/><path d="M12 18v2"/><path d="M19 16l1 2"/>
            </svg>
          </div>
          <input type="text" class="user-name-input" id="userNameInput" placeholder="输入用户名"/>
        </div>
        <div class="user-mask">********************</div>
      </div>
      <button class="logout" onclick="toast('退出登录')">退出登录</button>

    </div>
  </div>

  <div class="card">
    <div class="qr-wrap">
      <canvas id="qr" width="660" height="660"></canvas>
    </div>
    <div class="valid-row">
      <span class="label">此码有效期:</span>
      <span class="count" id="count">300</span>
      <button class="refresh-btn" id="refreshBtn" onclick="onRefresh()">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2f8be6" stroke-width="2" stroke-linecap="round">
          <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v5h-5"/>
        </svg>
        刷新
      </button>
    </div>
    <div class="expire">有效期至：&nbsp;&nbsp;<span id="expire">--</span></div>
  </div>

  <div class="tip-card">
    <div class="tip">
      警方提示:谨防网络贷款、投资理财、兼职刷单，网购退款等诈骗<br>
      防范诈骗全民行，共建金塘无诈镇
    </div>
    <div class="divider"></div>
    <div class="grid">
      <div class="grid-row">
        <div class="grid-item" onclick="toast('一键申报')"><div class="circle c-green"><img src="icons/stack.png" class="grid-icon"></div><span>一键申报</span></div>
        <div class="grid-item" onclick="toast('信息变更')"><div class="circle c-blue"><img src="icons/edit.png" class="grid-icon"></div><span>信息变更</span></div>
        <div class="grid-item" onclick="toast('人脸采集')"><div class="circle c-red"><img src="icons/camera.png" class="grid-icon"></div><span>人脸采集</span></div>
      </div>
      <div class="grid-row">
        <div class="grid-item" onclick="toast('申报记录')"><div class="circle c-purple"><img src="icons/file-pen.png" class="grid-icon"></div><span>申报记录</span></div>
        <div class="grid-item" onclick="toast('车辆管理')"><div class="circle c-orange"><img src="icons/car.png" class="grid-icon"></div><span>车辆管理</span></div>
      </div>
      <div class="grid-row">
        <div class="grid-item" onclick="toast('扫一扫打卡')"><div class="circle c-green2"><img src="icons/scan.png" class="grid-icon"></div><span>扫一扫打卡</span></div>
        <div class="grid-item" onclick="toast('打卡')"><div class="circle c-red"><img src="icons/check_in.png" class="grid-icon"></div><span>打卡</span></div>
        <div class="grid-item" onclick="toast('我的考勤')"><div class="circle c-purple"><img src="icons/Basic_calendar.png" class="grid-icon"></div><span>我的考勤</span></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="qrcode/constants.js"></script>
  <script src="qrcode/math.js"></script>
  <script src="qrcode/polynomial.js"></script>
  <script src="qrcode/bit-buffer.js"></script>
  <script src="qrcode/byte.js"></script>
  <script src="qrcode/rs-block.js"></script>
  <script src="qrcode/util.js"></script>
  <script src="qrcode/model.js"></script>
  <script src="qrcode/drawing.js"></script>
  <script src="qrcode/qrcode.js"></script>
  <script src="app.js"></script>
</body>
</html>
