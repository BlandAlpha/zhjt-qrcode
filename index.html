<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>智护金塘平台系统</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#cfe1f2;
    color:#333;
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  /* 状态栏 */
  .statusbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 22px 6px;
    font-weight:600; font-size:16px;
    background:#ededed;
  }
  .statusbar .right { display:flex; align-items:center; gap:6px; }
  .signal { letter-spacing:1px; font-size:13px; }
  .battery {
    width:26px; height:13px; border:1.5px solid #333; border-radius:3px;
    position:relative; display:inline-block;
  }
  .battery::after { content:""; position:absolute; right:-3px; top:3px; width:2px; height:5px; background:#333; border-radius:0 2px 2px 0; }
  .battery i { position:absolute; left:1px; top:1px; bottom:1px; width:30%; background:#e8503a; border-radius:1px; }

  /* 导航栏 */
  .navbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 22px 14px;
    background:#ededed;
  }
  .navbar .title { text-align:center; flex:1; }
  .navbar .title h1 { font-size:18px; font-weight:600; color:#222; }
  .navbar .title p { font-size:12px; color:#888; margin-top:2px; }
  .navbar .ico { font-size:22px; color:#333; width:30px; }
  .navbar .ico.dots { text-align:right; letter-spacing:1px; }

  /* 蓝色头部横幅 */
  .banner {
    background:linear-gradient(120deg,#1769d4,#2f8be6);
    padding:24px 20px 70px;
    position:relative;
    overflow:hidden;
  }
  .banner::before {
    content:""; position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 26px),
      repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 2px, transparent 2px 30px);
    opacity:.6;
  }
  .banner-row { display:flex; align-items:center; position:relative; z-index:1; }
  .avatar {
    width:66px; height:66px; border-radius:50%;
    background:linear-gradient(135deg,#9aa7b8,#6c7889);
    flex-shrink:0; border:2px solid rgba(255,255,255,.6);
  }
  .user-info { margin-left:14px; flex:1; color:#fff; }
  .user-name { display:flex; align-items:center; gap:8px; font-size:22px; font-weight:600; cursor:pointer; position:relative; }
  .user-name svg { width:22px; height:22px; }
  .user-name-display { display:flex; align-items:center; gap:8px; }
  .user-name-input {
    display:none; border:none; outline:none;
    background:rgba(255,255,255,.2); color:#fff; padding:4px 8px;
    border-radius:6px; font-size:22px; font-weight:600;
    font-family:inherit; width:140px;
  }
  .user-name-input::placeholder { color:rgba(255,255,255,.6); }
  .user-name-input::-webkit-outer-spin-button,
  .user-name-input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .user-name.editing .user-name-display { display:none; }
  .user-name.editing .user-name-input { display:block; }
  .user-mask { font-size:16px; letter-spacing:2px; margin-top:6px; opacity:.95; }
  .logout {
    border:1.5px solid rgba(255,255,255,.8); color:#fff;
    background:transparent; border-radius:26px;
    padding:10px 18px; font-size:16px; cursor:pointer;
    white-space:nowrap;
  }
  .logout:active { background:rgba(255,255,255,.15); }

  /* 二维码卡片 */
  .card {
    background:#fff; border-radius:14px;
    margin:-50px 16px 0; padding:22px 18px 24px;
    box-shadow:0 6px 20px rgba(0,0,0,.06);
    position:relative; z-index:2;
  }
  .qr-wrap { display:flex; justify-content:center; }
  #qr { width:78%; max-width:340px; aspect-ratio:1/1; display:block; image-rendering:pixelated; }

  .valid-row {
    display:flex; align-items:center; justify-content:center;
    gap:14px; margin-top:18px;
  }
  .valid-row .label { font-size:18px; color:#333; }
  .valid-row .count { font-size:40px; font-weight:800; color:#111; min-width:96px; text-align:center; }
  .refresh-btn {
    display:flex; align-items:center; gap:6px;
    border:1.5px solid #2f8be6; color:#2f8be6; background:#fff;
    border-radius:10px; padding:9px 14px; font-size:17px; cursor:pointer;
    transition:opacity .2s;
  }
  .refresh-btn:active { background:#f0f7ff; }
  .refresh-btn.loading { opacity:.5; pointer-events:none; }
  .refresh-btn svg { width:20px; height:20px; }
  .refresh-btn.spin svg { animation:spin .5s linear; }
  @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }

  .expire { text-align:center; margin-top:14px; color:#9a9a9a; font-size:17px; }
  .expire span { color:#9a9a9a; }

  /* 警方提示卡片 */
  .tip-card {
    background:#fff; border-radius:14px;
    margin:14px 16px 0; padding:26px 22px 18px;
  }
  .tip { color:#e8503a; text-align:center; line-height:1.7; font-size:16px; }
  .divider { height:1px; background:#eee; margin:22px 4px; }

  /* 功能按钮宫格 */
  .grid {
    display:grid; grid-template-columns:repeat(3,1fr);
    gap:30px 10px; padding:6px 4px 10px;
  }
  .grid-item { text-align:center; cursor:pointer; }
  .grid-item .circle {
    width:64px; height:64px; border-radius:50%;
    margin:0 auto 10px; display:flex; align-items:center; justify-content:center;
    font-size:30px;
  }
  .grid-item:active .circle { transform:scale(.94); }
  .grid-item .circle { transition:transform .12s; }
  .grid-item span { font-size:16px; color:#333; font-weight:600; }
  .c-green{background:#3fb37a;} .c-blue{background:#3d8bf2;} .c-red{background:#c0533f;}
  .c-purple{background:#6f72cf;} .c-orange{background:#ef914a;}

  /* 底部导航箭头 */
  .footnav {
    display:flex; justify-content:center; gap:120px;
    padding:24px 0 30px; color:#bbb; font-size:30px;
  }
  .footnav span:last-child { color:#ddd; }

  .toast {
    position:fixed; left:50%; bottom:80px; transform:translateX(-50%);
    background:rgba(0,0,0,.78); color:#fff; padding:10px 20px;
    border-radius:8px; font-size:15px; opacity:0; transition:opacity .25s;
    pointer-events:none; z-index:99;
  }
  .toast.show { opacity:1; }
</style>
</head>
<body>

  <div class="banner">
    <div class="banner-row">
      <div class="avatar"></div>
      <div class="user-info">
        <div class="user-name" id="userNameEdit">
          <div class="user-name-display">
            用户名
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
              <path d="M3 13c2.5 3.5 6 5 9 5s6.5-1.5 9-5"/>
              <path d="M5 16l-1 2"/><path d="M12 18v2"/><path d="M19 16l1 2"/>
            </svg>
          </div>
          <input type="text" class="user-name-input" id="userNameInput" placeholder="输入用户名"/>
        </div>
        <div class="user-mask">********************</div>
      </div>
      <button class="logout" onclick="toast('退出登录')">退出登录</button>
    </div>
  </div>

  <div class="card">
    <div class="qr-wrap">
      <canvas id="qr" width="660" height="660"></canvas>
    </div>
    <div class="valid-row">
      <span class="label">此码有效期:</span>
      <span class="count" id="count">300</span>
      <button class="refresh-btn" id="refreshBtn" onclick="onRefresh()">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2f8be6" stroke-width="2" stroke-linecap="round">
          <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v5h-5"/>
        </svg>
        刷新
      </button>
    </div>
    <div class="expire">有效期至：&nbsp;&nbsp;<span id="expire">--</span></div>
  </div>

  <div class="tip-card">
    <div class="tip">
      警方提示:谨防网络贷款、投资理财、兼职刷单，网购退款等诈骗<br>
      防范诈骗全民行，共建金塘无诈镇
    </div>
    <div class="divider"></div>
    <div class="grid">
      <div class="grid-item" onclick="toast('一键申报')"><div class="circle c-green">☰</div><span>一键申报</span></div>
      <div class="grid-item" onclick="toast('信息变更')"><div class="circle c-blue">✎</div><span>信息变更</span></div>
      <div class="grid-item" onclick="toast('人脸采集')"><div class="circle c-red">📷</div><span>人脸采集</span></div>
      <div class="grid-item" onclick="toast('申报记录')"><div class="circle c-purple">📝</div><span>申报记录</span></div>
      <div class="grid-item" onclick="toast('车辆管理')"><div class="circle c-orange">🚗</div><span>车辆管理</span></div>
      <div></div>
      <div class="grid-item" onclick="toast('扫一扫打卡')"><div class="circle c-green">⛶</div><span>扫一扫打卡</span></div>
      <div class="grid-item" onclick="toast('打卡')"><div class="circle c-red">✓</div><span>打卡</span></div>
      <div class="grid-item" onclick="toast('我的考勤')"><div class="circle c-purple">📅</div><span>我的考勤</span></div>
    </div>
  </div>

  <!-- <div class="footnav"><span>‹</span><span>›</span></div> -->

  <div class="toast" id="toast"></div>

<script>
  /* ---------- 有效期至：当前时间 +3 天 早上 8 点 ---------- */
  function setExpire(){
    const d = new Date();
    d.setDate(d.getDate() + 3);
    d.setHours(8, 0, 0, 0);
    const p = n => String(n).padStart(2,'0');
    const str = d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate())
              + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    document.getElementById('expire').textContent = str;
  }
  setExpire();

  /* ---------- 随机二维码绘制 ---------- */
  function drawQR(){
    const canvas = document.getElementById('qr');
    const ctx = canvas.getContext('2d');
    const size = canvas.width;
    const modules = 37;          // 模块数固定，保证大小差不多
    const quiet = 2;             // 静区
    const total = modules + quiet*2;
    const cell = size / total;

    ctx.fillStyle = '#fff';
    ctx.fillRect(0,0,size,size);

    const inFinder = (r,c) => (r<8&&c<8)||(r<8&&c>=modules-8)||(r>=modules-8&&c<8);

    // 随机数据模块
    ctx.fillStyle = '#1a1a1a';
    for(let r=0;r<modules;r++){
      for(let c=0;c<modules;c++){
        if(inFinder(r,c)) continue;
        if(r===6 || c===6){           // 定位时序线
          if((r+c)%2===0){ ctx.fillRect((c+quiet)*cell,(r+quiet)*cell,cell+0.6,cell+0.6); }
          continue;
        }
        if(Math.random() < 0.46){
          ctx.fillRect((c+quiet)*cell,(r+quiet)*cell,cell+0.6,cell+0.6);
        }
      }
    }

    // 三个定位角
    function finder(r,c){
      ctx.fillStyle='#1a1a1a'; ctx.fillRect((c+quiet)*cell,(r+quiet)*cell,7*cell,7*cell);
      ctx.fillStyle='#fff';    ctx.fillRect((c+1+quiet)*cell,(r+1+quiet)*cell,5*cell,5*cell);
      ctx.fillStyle='#1a1a1a'; ctx.fillRect((c+2+quiet)*cell,(r+2+quiet)*cell,3*cell,3*cell);
    }
    finder(0,0); finder(0,modules-7); finder(modules-7,0);

    // 右下角对齐图案
    (function align(r,c){
      ctx.fillStyle='#1a1a1a'; ctx.fillRect((c+quiet)*cell,(r+quiet)*cell,5*cell,5*cell);
      ctx.fillStyle='#fff';    ctx.fillRect((c+1+quiet)*cell,(r+1+quiet)*cell,3*cell,3*cell);
      ctx.fillStyle='#1a1a1a'; ctx.fillRect((c+2+quiet)*cell,(r+2+quiet)*cell,cell,cell);
    })(modules-9, modules-9);
  }
  drawQR();

  /* ---------- 300 秒倒计时 ---------- */
  let count = 300;
  let timer = null;
  const countEl = document.getElementById('count');

  function startCountdown(){
    clearInterval(timer);
    count = 300;
    countEl.textContent = count;
    timer = setInterval(() => {
      count--;
      if(count <= 0){ count = 0; clearInterval(timer); }
      countEl.textContent = count;
    }, 1000);
  }
  startCountdown();

  /* ---------- 刷新：~0.5s 延迟后换码 + 重置倒计时 ---------- */
  function onRefresh(){
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('loading','spin');
    clearInterval(timer);
    setTimeout(() => {
      drawQR();
      startCountdown();
      btn.classList.remove('loading','spin');
    }, 500);
  }

  /* ---------- 简易提示 ---------- */
  let toastTimer = null;
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1200);
  }

  /* ---------- 用户名编辑功能 ---------- */
  const userNameEdit = document.getElementById('userNameEdit');
  const userNameDisplay = userNameEdit.querySelector('.user-name-display');
  const userNameInput = document.getElementById('userNameInput');

  // 点击用户名进入编辑模式
  userNameEdit.addEventListener('click', () => {
    if(!userNameEdit.classList.contains('editing')){
      userNameInput.value = userNameDisplay.textContent.trim();
      userNameEdit.classList.add('editing');
      userNameInput.focus();
      userNameInput.select();
    }
  });

  // 保存用户名
  function saveUserName(){
    const newName = userNameInput.value.trim() || '用户名';
    userNameDisplay.textContent = newName;
    userNameEdit.classList.remove('editing');
  }

  // 按 Enter 保存
  userNameInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      saveUserName();
    } else if(e.key === 'Escape'){
      userNameEdit.classList.remove('editing');
    }
  });

  // 点击外部时保存
  userNameInput.addEventListener('blur', () => {
    setTimeout(() => {
      if(userNameEdit.classList.contains('editing')){
        saveUserName();
      }
    }, 0);
  });
</script>
</body>
</html>
